# The single place where versions are pinned.
#
# Rules (docs/ENGINEERING_STANDARDS.md):
#   - Latest STABLE release only. Never alpha, beta, rc, milestone or a snapshot. One entry is
#     an exception that Shawn decided, and says so: carApp.
#   - Exact versions as plain strings. No ranges, no "+", no "latest.release".
#   - An entry exists only while the code uses it. Add the library in the change that needs it.
#   - Dependabot opens the update pull requests; do not bump versions by hand in feature work.

[versions]
# Build toolchain. AGP, Gradle (gradle/wrapper/gradle-wrapper.properties) and Kotlin move together:
# read the compatibility tables before merging an update to any of them.
agp = "9.4.1"
# Kotlin, the Compose compiler plugin and the serialization plugin share this one version
# because the compiler plugins are released with, and only work with, the matching compiler.
kotlin = "2.4.20"
# KSP runs Room's code generator. Since KSP 2.3 its version is no longer tied to the Kotlin version.
ksp = "2.3.12"
spotless = "8.10.3"
ktlint = "1.8.0"

# Libraries.
activityCompose = "1.13.0"
# The Car App Library: the Android Auto screen, and CarConnection, which tells the trip service
# whether Android Auto is connected.
# THE ONE EXCEPTION to "stable only", decided by Shawn on 2026-10-06 (ADR-001, "Exception"): a
# release candidate, taken because its release notes say it includes a security fix and tell
# every lower version to update, and MilO's car service is exported. The newest stable release
# is still 1.7.0, which lacks the fix.
# TODO(debt): return to the stable line. Change this to 1.8.0 the day 1.8.0 is stable, and take
# the "androidx.car.app" ignore rule out of .github/dependabot.yml in the same change (it hides
# pre-releases only, so a rule that is forgotten hides nothing stable). Never move this to
# another pre-release (1.8.0-rc02, 1.9.0-alpha...) without asking Shawn.
carApp = "1.8.0-rc01"
composeBom = "2026.09.00"
# androidx.core, for one class: FileProvider, which hands the report for the accountant to the
# email app (platform/report/ReportHandOff.kt, and the provider in the manifest). Other
# libraries already bring an older androidx.core along; it is declared because MilO's own code
# and manifest name the class.
core = "1.19.1"
coroutines = "1.11.0"
datastore = "1.2.1"
junit = "4.13.2"
lifecycle = "2.11.0"
# Navigation 3: the back stack of screens and the display that shows its top entry.
navigation3 = "1.2.0"
# Google Play services' fused location provider: the GPS fixes of a trip.
playServicesLocation = "21.4.0"
# Room's runtime, its KSP compiler and its Gradle plugin are released together under one version.
room = "3.0.3"
# The runtime of kotlinx.serialization. Navigation 3 saves its back stack through it, so every
# screen key is @Serializable. Pinned here because Navigation 3 alone would bring a much older one.
serializationJson = "1.11.0"
# The SQLite build Room 3 runs on. It is compiled into the app, so the database engine is the
# same on every Android version and does not change under the stored trips after a system update.
sqlite = "2.7.1"

[libraries]
# AGP 9 compiles Kotlin itself and bundles an older Kotlin Gradle plugin. The root build script
# puts this one on the build classpath so the compiler is the version pinned above.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Never on a classpath: Spotless downloads ktlint itself. Listed as a library only because
# Dependabot ignores a version that is not attached to a dependency.
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
# What makes the Car App Library screen an Android Auto app (projected from the phone). It does
# not bring "app" in for compiling, so both are declared, as Google's own setup does.
androidx-car-app-projected = { module = "androidx.car.app:app-projected", version.ref = "carApp" }

# The BOM pins every androidx.compose artifact below to versions tested together, which is why
# those entries carry no version of their own.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

androidx-core = { module = "androidx.core:core", version.ref = "core" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# repeatOnLifecycle: the Android Auto screen follows the trip only while the car shows it. The
# Car App Library alone would bring a much older lifecycle (2.2.0), which does not have it.
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
# LifecycleEventEffect: how a screen learns that it has come to the front again.
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
# viewModel() for Compose: how a screen gets its ViewModel.
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Gives each screen on the Navigation 3 back stack its own ViewModel, cleared when it is popped.
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }

# Room 3 lives in the androidx.room3 group. WorkManager will later bring the old androidx.room
# group in as well, so imports must always come from androidx.room3.
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# Tests only: a clock and a scheduler the test controls, for code that runs in coroutines.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Writes each database's schema to app/schemas as JSON, so a later version can be migrated to and
# the change to the tables shows up in the diff.
androidx-room3 = { id = "androidx.room3", version.ref = "room" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Generates the serializers for the @Serializable screen keys of the navigation back stack.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
