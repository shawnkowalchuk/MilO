# The single place where versions are pinned.
#
# Rules (docs/ENGINEERING_STANDARDS.md):
#   - Latest STABLE release only. Never alpha, beta, rc, milestone or a snapshot.
#   - Exact versions as plain strings. No ranges, no "+", no "latest.release".
#   - An entry exists only while the code uses it. Add the library in the change that needs it.
#   - Dependabot opens the update pull requests; do not bump versions by hand in feature work.

[versions]
# Build toolchain. AGP, Gradle (gradle/wrapper/gradle-wrapper.properties) and Kotlin move together:
# read the compatibility tables before merging an update to any of them.
agp = "9.4.1"
# Kotlin, the Compose compiler plugin and (later) the serialization plugin share this one version
# because the compiler plugins are released with, and only work with, the matching compiler.
kotlin = "2.4.20"
spotless = "8.10.3"
ktlint = "1.8.0"

# Libraries.
activityCompose = "1.13.0"
composeBom = "2026.09.00"
junit = "4.13.2"

[libraries]
# AGP 9 compiles Kotlin itself and bundles an older Kotlin Gradle plugin. The root build script
# puts this one on the build classpath so the compiler is the version pinned above.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

# Never on a classpath: Spotless downloads ktlint itself. Listed as a library only because
# Dependabot ignores a version that is not attached to a dependency.
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

# The BOM pins every androidx.compose artifact below to versions tested together, which is why
# those entries carry no version of their own.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
