# Build settings shared by the terminal, Android Studio and CI.
# Nothing secret belongs here: this file is committed. Machine paths go in local.properties,
# which git ignores. Signing details stay outside the repository.

# The Gradle default heap (512 MB) is too small for the Android and Kotlin compilers.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Reuse task outputs between runs.
org.gradle.caching=true

# The configuration cache stays OFF, deliberately. With it on, Gradle saves everything the build
# scripts worked out, and that includes the signing password app/build.gradle.kts reads from the
# macOS Keychain. The saved copy is encrypted, but with a key Gradle keeps in ~/.gradle, so it
# would sit in this folder's .gradle directory, and in every backup of it, readable without the
# Keychain. The price is about a second more per Gradle command.
org.gradle.configuration-cache=false

# A warning in a Gradle Kotlin script (*.gradle.kts) fails the build, the same as one in app code.
# allWarningsAsErrors in app/build.gradle.kts only covers the app and test sources, and a build
# script is where a deprecated Gradle or Android Gradle plugin call shows up first.
org.gradle.kotlin.dsl.allWarningsAsErrors=true

kotlin.code.style=official
